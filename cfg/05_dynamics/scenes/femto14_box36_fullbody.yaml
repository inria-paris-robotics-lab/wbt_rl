# Scene manifest for femto14_box36, FULL-BODY collision variant.
#
# Identical to femto14_box36_halfsphere.yaml (same clip, same box/table objects,
# same half-sphere hand hulls) except robot_geoms also pairs the box against one
# convex-hull collision geom per non-hand link (pelvis, torso, hips, knees,
# shoulders, elbows, forearms -- 22 links, generated by scripts/gen_link_hulls.py
# + grafted onto the scene by scripts/patch_fullbody_hull.py).
#
# Why: with only the hands paired (femto14_box36_halfsphere.yaml), the box has
# NO collision against the rest of the robot body at all -- SPIDER's stock MJCF
# disables contact globally (contype=0 on the g1 default class) and only
# re-enables it for whatever this list names. Visibly confirmed via
# replay_openloop.py --ghost: the box tunnels straight through the torso/forearm
# whenever the reference trajectory brings them close.
#
# Per-link hulls, not SPIDER's own per-link CoACD decomposition (1082 pieces
# total across these 22 links, up to 218 for a single link): pairing the box
# against every piece would multiply the box<->robot pair count SPIDER's CEM
# has to search each step by ~500x over the current 2 (hands only). A single
# convex hull per link keeps that at 24 -- same containment guarantee as the
# half-sphere hand hull (plain ConvexHull of the link's true vertex cloud, 0
# source vertices left outside), just coarser (a whole link collapsed to its
# hull can't represent a concavity -- e.g. the torso's underarm notch --  which
# is the price of the 500x pair-count cut).
#
# Excluded on purpose: feet/ankles (already have dedicated foot_collision
# spheres, and a chest-height box has no business touching them), head (same
# reasoning -- add it back here if a clip ever needs it), wrists' yaw link
# (already covered by the half-sphere hand hull, which sits at that body).
#
# Pairs with cfg/05_dynamics/robot_assets/g1_29dof_fullbody_hull/scene.xml.
#
# See ../README.md for the field reference.

objects:
  - name: box36
    kind: dynamic
    urdf: modules/third_party/holosoma_custom/src/holosoma/holosoma/data/motions/g1_29dof/whole_body_tracking/objects_box36.urdf
    pos_key: object_pos_w
    quat_key: object_quat_w

  - name: support
    kind: static
    mesh: modules/third_party/holosoma_custom/src/holosoma/holosoma/data/motions/g1_29dof/whole_body_tracking/femto14_support_box36.obj
    pos_key: support_pos_w
    quat_key: support_quat_w
    rgba: "0.6 0.4 0.2 1"

contact:
  robot_geoms:
    - left_wrist_yaw_link_halfsphere
    - right_wrist_yaw_link_halfsphere
    - pelvis_hull
    - torso_link_hull
    - left_hip_pitch_link_hull
    - left_hip_roll_link_hull
    - left_hip_yaw_link_hull
    - left_knee_link_hull
    - right_hip_pitch_link_hull
    - right_hip_roll_link_hull
    - right_hip_yaw_link_hull
    - right_knee_link_hull
    - left_shoulder_pitch_link_hull
    - left_shoulder_roll_link_hull
    - left_shoulder_yaw_link_hull
    - left_elbow_link_hull
    - left_wrist_roll_link_hull
    - left_wrist_pitch_link_hull
    - right_shoulder_pitch_link_hull
    - right_shoulder_roll_link_hull
    - right_shoulder_yaw_link_hull
    - right_elbow_link_hull
    - right_wrist_roll_link_hull
    - right_wrist_pitch_link_hull
  object_object: true   # box <-> table
  object_floor: true    # box <-> ground once released
  condim: 4
