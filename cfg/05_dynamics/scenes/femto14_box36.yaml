# Scene manifest for the femto14 box-carry clip (G1 29dof).
#
# Consumed by src/motion_convertor/wrappers/spider_build_scene.py. Paths are
# repo-root-relative unless absolute. See ../README.md for the field reference.
#
# The clip carries ONE dynamic object (the 36 cm box the robot picks up) and ONE
# static support (the table it is deposited on). Add further entries to `objects`
# to describe clips with more of either — the qpos tail grows by 6 DOF per
# dynamic object and static ones cost nothing.

objects:
  - name: box36
    kind: dynamic
    # Mass (811 g, measured), collision mesh and friction all come from the URDF
    # the training pipeline already uses — no duplicated magic numbers here.
    urdf: modules/third_party/holosoma_custom/src/holosoma/holosoma/data/motions/g1_29dof/whole_body_tracking/objects_box36.urdf
    pos_key: object_pos_w
    quat_key: object_quat_w

  - name: support
    kind: static
    # No URDF ships for the table; point at the mesh the clip was retargeted against.
    mesh: modules/third_party/holosoma_custom/src/holosoma/holosoma/data/motions/g1_29dof/whole_body_tracking/femto14_support_box36.obj
    pos_key: support_pos_w
    quat_key: support_quat_w
    rgba: "0.6 0.4 0.2 1"

contact:
  # Robot geoms allowed to touch the objects. The g1 MJCF disables collision
  # globally and re-enables it pair by pair, so anything omitted here simply
  # cannot make contact.
  # lh/rh no longer exist: the hand is now a convex-hull decomposition of the
  # real rubber_hand mesh (scripts/build_convex_spider.py), not a single sphere.
