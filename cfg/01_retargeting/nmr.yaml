# NMR retargeter — WBT-RL module config
# Repo: https://github.com/NJU3DV-HumanoidGroup/MakeTrackingEasy
#
# Feed-forward SMPL-X -> G1 network. Takes SMPL/SMPL-X parameters only — there is no BVH
# front-end, so LAFAN is deliberately not declared: an unsupported dataset must fail at
# config lookup rather than silently produce something wrong.

native_input_format:
  SFU:       nmr_smplx_npz
  OMOMO:     nmr_smplx_npz

native_output_format: nmr_bmimic_npz

entry_point_by_input_format:
  nmr_smplx_npz: smplx

robot_config:
  G1_29dof:
    name: unitree_g1
    urdf: modules/01_retargeting/NMR/assets/g1_29dof.urdf

env: nmr

entry_points:
  smplx:
    cmd: python src/motion_convertor/wrappers/nmr_smplx.py
    args:
      input:  --smplx_file
      output: --save_path
